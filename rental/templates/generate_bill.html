<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>बिल जनरेट करें</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm">
        <h3 class="mb-3">बिल बनाएं</h3>
        <p class="text-muted">
            किरायेदार: <strong>{{ tenant.name }}</strong><br>
            कमरा: {{ tenant.property_assigned.property_name }}<br>
            मासिक किराया: ₹{{ tenant.property_assigned.monthly_rent }}
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">महीना / साल</label>
                <input type="text" name="month_year" class="form-control" 
                       placeholder="उदाहरण: August 2026" required>
            </div>
            <div class="mb-3">
                <label class="form-label">बिजली यूनिट्स</label>
                <input type="number" name="units" class="form-control" value="0" min="0">
            </div>
            <div class="mb-3">
                <label class="form-label">दर प्रति यूनिट (₹)</label>
                <input type="number" name="rate" class="form-control" value="8" step="0.01">
            </div>
            <button type="submit" class="btn btn-primary w-100">बिल सेव करें</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">वापस</a>
        </form>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate Bill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 500px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="mb-1">Generate Bill</h4>
            <p class="text-muted mb-4">
                <strong>{{ tenant.name }}</strong><br>
                {{ tenant.property_assigned.property_name }}
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Month / Year</label>
                    <input type="text" name="month_year" class="form-control" 
                           placeholder="e.g. August 2026" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rent Amount (₹)</label>
                    <input type="number" name="rent_amount" class="form-control" 
                           step="0.01" value="{{ default_rent }}" required>
                    <small class="text-muted">
                        You can change this if the rent was different in that month
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Electricity Units</label>
                    <input type="number" name="units" class="form-control" value="0" min="0">
                </div>

                <div class="mb-4">
                    <label class="form-label">Rate per Unit (₹)</label>
                    <input type="number" name="rate" class="form-control" value="8" step="0.01">
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-2">Generate Bill</button>
                <a href="{% url 'tenant_bills' tenant.id %}" class="btn btn-outline-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>

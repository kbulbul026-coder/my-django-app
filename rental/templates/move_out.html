<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Move Out Tenant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 480px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="mb-3 text-danger">Tenant Move Out</h4>
            <p class="text-muted">
                <strong>{{ tenant.name }}</strong><br>
                Room: {{ tenant.property_assigned.property_name }}<br>
                Move-in Date: {{ tenant.move_in_date }}
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label">Move Out Date</label>
                    <input type="date" name="move_out_date" class="form-control form-control-lg" value="{{ today }}" required>
                </div>

                <button type="submit" class="btn btn-danger w-100 mb-2"
                        onclick="return confirm('क्या आप वाकई इस किरायेदार को Move Out करना चाहते हैं?')">
                    Confirm Move Out
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>

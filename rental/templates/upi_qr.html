<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UPI Payment QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 420px;">
    <div class="card shadow-sm border-0 text-center">
        <div class="card-body p-4">
            <h4 class="mb-1">UPI Payment QR</h4>
            <p class="text-muted mb-3">
                <strong>{{ record.tenant.name }}</strong><br>
                {{ record.month_year }}
            </p>

            <h2 class="text-success mb-3">₹{{ amount }}</h2>

            <img src="data:image/png;base64,{{ qr_code }}" 
                 alt="UPI QR Code" 
                 class="img-fluid mb-3 border rounded"
                 style="max-width: 260px;">

            <p class="small text-muted mb-2">
                Scan using any UPI app<br>
                (Google Pay, PhonePe, Paytm, BHIM)
            </p>

            <p class="small mb-4">
                <strong>Note:</strong> {{ note }}
            </p>

            <a href="{% url 'record_payment' record.id %}" class="btn btn-success w-100 mb-2">
                Payment Received → Record it
            </a>
            <a href="{% url 'tenant_bills' record.tenant.id %}" class="btn btn-outline-secondary w-100">
                Back
            </a>
        </div>
    </div>
</div>

</body>
</html>

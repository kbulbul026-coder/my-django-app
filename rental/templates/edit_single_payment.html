<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 480px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="mb-3">Edit Payment</h4>
            <p class="text-muted">
                {{ record.tenant.name }} — {{ record.month_year }}
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" name="amount" class="form-control form-control-lg" 
                           step="0.01" value="{{ payment.amount }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select form-select-lg">
                        <option value="CASH" {% if payment.payment_method == 'CASH' %}selected{% endif %}>💵 Cash</option>
                        <option value="DIGITAL" {% if payment.payment_method == 'DIGITAL' %}selected{% endif %}>📱 Digital</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Payment Date</label>
                    <input type="date" name="payment_date" class="form-control form-control-lg"
                           value="{{ payment.payment_date|date:'Y-m-d' }}">
                </div>

                <div class="mb-4">
                    <label class="form-label">Note</label>
                    <textarea name="note" class="form-control" rows="3">{{ payment.note }}</textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-2">Update Payment</button>
                <a href="{% url 'tenant_bills' record.tenant.id %}" class="btn btn-outline-secondary w-100">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>

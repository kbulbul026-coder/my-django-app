<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mark as Paid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 480px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="mb-1">Mark as Paid</h4>
            <p class="text-muted mb-4">
                <strong>{{ record.tenant.name }}</strong><br>
                {{ record.month_year }} &nbsp;|&nbsp; 
                Amount: <strong class="text-success">₹{{ record.total_due }}</strong>
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Payment Method</label>
                    <select name="payment_method" class="form-select form-select-lg" required>
                        <option value="CASH">💵 Cash</option>
                        <option value="DIGITAL">📱 Digital (UPI / Bank)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Payment Date</label>
                    <input type="date" name="payment_date" class="form-control form-control-lg" 
                           value="{{ today }}" required>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 mb-2">
                    Save as Paid
                </button>
                <a href="{% url 'tenant_bills' record.tenant.id %}" 
                   class="btn btn-outline-secondary w-100">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>

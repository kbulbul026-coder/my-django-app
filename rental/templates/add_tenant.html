<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>नया किरायेदार</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 500px;">
    <div class="card p-4 shadow-sm">
        <h3 class="mb-3">नया किरायेदार जोड़ें</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">किरायेदार का नाम</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">फोन नंबर</label>
                <input type="text" name="phone" class="form-control" required placeholder="10 अंकों का नंबर">
            </div>
            <div class="mb-3">
                <label class="form-label">प्रॉपर्टी / कमरा</label>
                <select name="property" class="form-select" required>
                    <option value="">-- चुनें --</option>
                    {% for prop in properties %}
                        <option value="{{ prop.id }}">{{ prop.property_name }} (₹{{ prop.monthly_rent }})</option>
                    {% endfor %}
                </select>
            </div>

<div class="mb-3">
    <label class="form-label">Billing Day (किराया शुरू होने की तारीख)</label>
    <input type="number" name="billing_day" class="form-control" 
           value="1" min="1" max="28" required>
    <small class="text-muted">Example: 1 = 1st of every month, 5 = 5th of every month</small>
</div>


            <div class="mb-3">
                <label class="form-label">एडवांस सिक्योरिटी (₹)</label>
                <input type="number" name="advance_security" class="form-control" value="0" min="0">
            </div>
            <button type="submit" class="btn btn-success w-100">सुरक्षित करें</button>
            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">वापस</a>
        </form>
    </div>
</div>

</body>
</html>
